<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Color scheme preview (dev tool, not part of the site)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        padding: 20px;
      }
      #controls {
        margin-bottom: 20px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
      }
      .phase-label {
        font-size: 14px;
        opacity: 0.7;
        margin: 14px 0 6px;
      }
      .gradient-bar {
        height: 50px;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      .faces {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-auto-rows: 34px;
        gap: 3px;
        margin-bottom: 4px;
      }
      .swatch {
        border-radius: 3px;
      }
      .scheme-block {
        border: 1px solid #333;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .meta {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Color scheme preview</h2>
    <p style="opacity: 0.7">
      Throwaway dev tool - not part of the site. Lets us eyeball generated schemes before wiring into the real scene.
    </p>
    <div id="controls">
      <label>Seed: <input id="seedInput" type="number" value="0" style="width: 100px" /></label>
      <button id="renderBtn">Render this seed</button>
      <button id="randomBtn">Random seed</button>
      <button id="batchBtn">Show 6 random schemes</button>
    </div>
    <div id="output"></div>

    <script type="module">
      import { generateColorScheme } from "./JS/colorScheme.js";

      function renderScheme(scheme) {
        const block = document.createElement("div");
        block.className = "scheme-block";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `seed=${scheme.seed}  palette=${scheme.paletteName}  textLight=${scheme.textLight}`;
        block.appendChild(meta);

        for (const phase of ["dark", "light"]) {
          const label = document.createElement("div");
          label.className = "phase-label";
          label.textContent = `${phase} phase - bg gradient:`;
          block.appendChild(label);

          const bar = document.createElement("div");
          bar.className = "gradient-bar";
          bar.style.background = `linear-gradient(90deg, ${scheme[phase].bg[0]}, ${scheme[phase].bg[1]})`;
          block.appendChild(bar);

          const facesLabel = document.createElement("div");
          facesLabel.className = "phase-label";
          facesLabel.textContent = `${phase} phase - per-face colors (rows=face 0-5, cols=cube 0-4):`;
          block.appendChild(facesLabel);

          const grid = document.createElement("div");
          grid.className = "faces";
          scheme[phase].faces.forEach((row) => {
            row.forEach((hex) => {
              const sw = document.createElement("div");
              sw.className = "swatch";
              sw.style.background = hex;
              sw.title = hex;
              grid.appendChild(sw);
            });
          });
          block.appendChild(grid);
        }

        document.getElementById("output").prepend(block);
      }

      document.getElementById("renderBtn").onclick = () => {
        const seed = Number(document.getElementById("seedInput").value);
        document.getElementById("output").innerHTML = "";
        renderScheme(generateColorScheme(seed));
      };
      document.getElementById("randomBtn").onclick = () => {
        const seed = Math.floor(Math.random() * 100000);
        document.getElementById("seedInput").value = seed;
        document.getElementById("output").innerHTML = "";
        renderScheme(generateColorScheme(seed));
      };
      document.getElementById("batchBtn").onclick = () => {
        document.getElementById("output").innerHTML = "";
        for (let i = 0; i < 6; i++) renderScheme(generateColorScheme(Math.floor(Math.random() * 100000)));
      };

      renderScheme(generateColorScheme(0));
    </script>
  </body>
</html>
