<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio — Yusif Safarzade</title>
    <meta
      name="description"
      content="A collection of web, game, and design projects by Yusif Safarzade."
    />
    <meta property="og:title" content="Portfolio — Yusif Safarzade" />
    <meta
      property="og:description"
      content="A collection of web, game, and design projects by Yusif Safarzade."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../CSS/portfolio.css" />
    <link rel="stylesheet" href="../CSS/transitions.css" />
    <link rel="icon" type="image/svg+xml" href="../icons/favicon.svg" />

    <script src="https://unpkg.com/lenis@1.3.17/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <div class="title">
      <a href="../index.html?skipIntro=1" class="back-button">
        <img src="../icons/BackButton.svg" alt="Back" />
      </a>
      <h1 class="title-header">Portfolio</h1>
    </div>

    <div class="content-wrapper" id="content-wrapper">
      <!-- Category sections are built from Projects/categories.json + projects.json below -->
      <section class="category-section" id="contacts-section">
        <h2 class="category-contacts"><a href="contacts.html">Contacts.</a></h2>
      </section>
    </div>

    <footer class="site-footer">
      <p>© 2026 Yusif Safarzade</p>
    </footer>
    <script type="module">
      import { createGradientBackground } from "../JS/gradientBackground.js";
      import { generateColorScheme } from "../JS/colorScheme.js";

      // Same flowing gradient system as the Home page - random scheme per
      // reload, ?seed=1234 pins a specific one. Portfolio has no scroll-driven
      // dark/light phase (that's a Home-page-only cube mechanic), so it just
      // uses one static color pair from the scheme instead of lerping between two.
      function resolveColorSeed() {
        const urlSeed = new URLSearchParams(window.location.search).get("seed");
        if (urlSeed !== null && urlSeed !== "" && !Number.isNaN(Number(urlSeed))) {
          return Number(urlSeed);
        }
        return Math.floor(Math.random() * 1_000_000_000);
      }
      const colorSeed = resolveColorSeed();
      console.log(`Color scheme seed: ${colorSeed} (revisit with ?seed=${colorSeed} in the URL)`);
      const colorScheme = generateColorScheme(colorSeed);

      // Uses the light-phase pair specifically (soft, high-lightness) since this
      // page's text/icons are a fixed dark color with no phase system to
      // adapt them - the dark-phase pair is too saturated/dark for that to
      // stay readable.
      const gradientBg = createGradientBackground({ seed: colorSeed, speed: 2.2 });
      gradientBg.setColors(colorScheme.light.bg[0], colorScheme.light.bg[1]);
      document.body.prepend(gradientBg.canvas);

      function renderGradient(timeMs) {
        gradientBg.render(timeMs / 1000);
        requestAnimationFrame(renderGradient);
      }
      requestAnimationFrame(renderGradient);

      gsap.registerPlugin(ScrollTrigger);

      // Initialize Lenis
      const lenis = new Lenis({
        autoRaf: true,
      });

      // Connect Lenis to ScrollTrigger for smooth integration
      lenis.on("scroll", ScrollTrigger.update);
      gsap.ticker.lagSmoothing(0);

      // Title and back-button animation doesn't depend on project data, so it
      // can run immediately rather than waiting on the fetch below.
      document.querySelectorAll(".title").forEach((item) => {
        gsap.fromTo(
          item,
          { y: 100, opacity: 0 },
          { y: 0, opacity: 1, duration: 1, ease: "expo.out" },
        );
      });

      function isVideoHero(src) {
        return /\.(mp4|webm)$/i.test(src);
      }

      // Hero can be a still image or a muted looping video - which one just
      // depends on the file extension in projects.json, no extra schema field.
      function buildHeroMedia(hero, title) {
        const src = `Projects/${hero}`;
        if (isVideoHero(hero)) {
          const video = document.createElement("video");
          Object.assign(video, { src, muted: true, loop: true, playsInline: true });
          return video;
        }
        const img = document.createElement("img");
        img.src = src;
        img.alt = title;
        return img;
      }

      function buildCategorySection(categoryName, ids, projects) {
        const section = document.createElement("section");
        section.className = "category-section";

        const heading = document.createElement("h2");
        heading.className = "category-header";
        heading.textContent = categoryName;
        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "grid";
        // An odd item count leaves one item alone in the final row - stretch
        // it to fill both columns instead of leaving an empty gap next to it.
        const isLastOfOddCount = (index) => ids.length % 2 !== 0 && index === ids.length - 1;

        ids.forEach((id, index) => {
          const project = projects[id];
          if (!project) {
            console.warn(`categories.json references unknown project id "${id}"`);
            return;
          }

          const a = document.createElement("a");
          a.href = `Projects/project.html?id=${id}`;
          a.className = isLastOfOddCount(index) ? "grid-item grid-item--wide" : "grid-item";
          a.appendChild(buildHeroMedia(project.hero, project.title));

          const overlay = document.createElement("div");
          overlay.className = "overlay-text";
          overlay.textContent = project.title;
          a.appendChild(overlay);

          grid.appendChild(a);
        });

        section.appendChild(grid);
        return section;
      }

      async function renderGrid() {
        const [categories, projects] = await Promise.all([
          fetch("Projects/categories.json").then((res) => res.json()),
          fetch("Projects/projects.json").then((res) => res.json()),
        ]);

        const contactsSection = document.getElementById("contacts-section");
        for (const [categoryName, ids] of Object.entries(categories)) {
          contactsSection.before(buildCategorySection(categoryName, ids, projects));
        }

        // Hero videos only decode/play while their grid item is actually on
        // screen - without this, all of them loop forever in the background
        // and the accumulated decode load causes the page to lag over time.
        // Pausing is debounced (and rootMargin gives some breathing room)
        // because scroll wobble can cross a video in/out of view several
        // times in a row - pausing/resuming on every single crossing thrashes
        // the video's decoder and ends up costing more than just leaving it.
        const pauseTimers = new Map();
        const videoObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              const video = entry.target;
              if (entry.isIntersecting) {
                clearTimeout(pauseTimers.get(video));
                pauseTimers.delete(video);
                video.play();
              } else if (!pauseTimers.has(video)) {
                pauseTimers.set(
                  video,
                  setTimeout(() => {
                    video.pause();
                    pauseTimers.delete(video);
                  }, 400),
                );
              }
            });
          },
          { rootMargin: "150px 0px" },
        );
        document.querySelectorAll(".grid video").forEach((video) => videoObserver.observe(video));

        // Grid item animations only make sense once the real items exist.
        gsap.utils.toArray(document.querySelectorAll(".grid-item")).forEach((item) => {
          gsap.from(item, {
            y: 50,
            opacity: 0,
            duration: 0.3,
            scrollTrigger: {
              trigger: item,
              start: "top 90%",
              toggleActions: "play none none reverse",
              ease: "expo.out",
            },
          });
        });
      }

      renderGrid();
    </script>
  </body>
</html>
