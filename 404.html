<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Yusif Safarzade</title>
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 1.5rem;
      }
      h1 {
        font-family: "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
        font-size: clamp(2.5rem, 6vw, 4rem);
        text-transform: uppercase;
        letter-spacing: 3px;
        color: #333;
      }
      p {
        font-size: 1.1rem;
        color: #333;
      }
      a {
        color: #333;
        font-size: 1.1rem;
        transition: opacity 0.2s;
      }
      a:hover {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a href="index.html">← Back to Home</a>

    <script type="module">
      import { createGradientBackground } from "./JS/gradientBackground.js";
      import { generateColorScheme } from "./JS/colorScheme.js";

      // Same flowing gradient system as the rest of the site - random scheme
      // per reload, no ?seed= support needed here since this page isn't
      // meant to be revisited/shared like the real content pages are.
      const colorScheme = generateColorScheme(Math.floor(Math.random() * 1_000_000_000));
      const gradientBg = createGradientBackground({ speed: 1.8 });
      gradientBg.setColors(colorScheme.light.bg[0], colorScheme.light.bg[1]);
      document.body.prepend(gradientBg.canvas);

      function renderGradient(timeMs) {
        gradientBg.render(timeMs / 1000);
        requestAnimationFrame(renderGradient);
      }
      requestAnimationFrame(renderGradient);
    </script>
  </body>
</html>
